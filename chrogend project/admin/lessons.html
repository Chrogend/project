<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Lessons — Admin MathVibe</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
</head>
<body class="dark-mode">

  <div id="app-header"></div>

  <div class="dashboard-wrapper">
    <div id="app-sidebar"></div>

    <main class="main-content">
      <div class="page-header" style="margin-bottom: 2rem;">
        <div>
          <h1 style="font-size: 2.2rem;">Lesson Content Manager</h1>
          <p style="color: var(--text-secondary);">Manage 10-page study sheets and worked examples for all 20 topics.</p>
        </div>
      </div>

      <div class="card" style="padding: 2rem;">
        <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
          <thead>
            <tr style="border-bottom: 1px solid var(--border-color); text-align: left;">
              <th style="padding: 0.8rem; color: var(--text-secondary);">Topic</th>
              <th style="padding: 0.8rem; color: var(--text-secondary);">Pages</th>
              <th style="padding: 0.8rem; color: var(--text-secondary);">Status</th>
              <th style="padding: 0.8rem; color: var(--text-secondary);">Action</th>
            </tr>
          </thead>
          <tbody id="admin-lessons-body">
            <!-- Dynamically rendered -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tbody = document.getElementById('admin-lessons-body');
      tbody.innerHTML = CURRICULUM_DATA.map(t => `
        <tr style="border-bottom: 1px solid var(--border-color);">
          <td style="padding: 0.8rem; font-weight: 600;">${t.title} (${t.code})</td>
          <td style="padding: 0.8rem;">${t.contentPages.length} Pages</td>
          <td style="padding: 0.8rem;"><span class="badge badge-success">Published</span></td>
          <td style="padding: 0.8rem;">
            <a href="../student/lessons.html?id=${t.id}" class="btn btn-outline" style="font-size: 0.8rem; padding: 0.3rem 0.8rem;">Preview Sheet</a>
          </td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
