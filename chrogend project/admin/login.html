<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal — MathVibe</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
</head>
<body class="dark-mode">

  <div id="app-header"></div>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
    <div class="card" style="max-width: 420px; width: 100%; padding: 2.5rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span style="font-size: 2.5rem;">⚙️</span>
        <h2 style="font-size: 1.8rem; margin-top: 0.5rem;">Instructor / Admin Login</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Manage 20 Core Mathematics Topics</p>
      </div>

      <form id="admin-login-form">
        <div style="margin-bottom: 1.2rem;">
          <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Admin Email</label>
          <input type="email" id="email" class="input-control" value="admin@mathvibe.org" required style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Password</label>
          <input type="password" id="password" class="input-control" value="admin123" required style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem;">Sign In to Admin</button>
      </form>
      
      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        <a href="../index.html" style="color: var(--primary); font-weight: 600;">← Back to Main Portal</a>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script>
    document.getElementById('admin-login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const user = {
        id: 99,
        name: 'Admin User',
        email: 'admin@mathvibe.org',
        role: 'admin'
      };
      Store.setUser(user);
      App.showToast('Signed in as Admin', 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
    });
  </script>
</body>
</html>
