<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Badges & Achievements — MathVibe</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
</head>
<body class="dark-mode">

  <div id="app-header"></div>

  <div class="dashboard-wrapper">
    <div id="app-sidebar"></div>

    <main class="main-content">
      <div class="page-header" style="margin-bottom: 2rem;">
        <div>
          <h1 style="font-size: 2.2rem;">Achievements & Study Streaks</h1>
          <p style="color: var(--text-secondary);">Unlock awards by completing mathematics modules and scoring high on quizzes.</p>
        </div>
      </div>

      <!-- Streak Banner -->
      <div class="card" style="padding: 2rem; background: linear-gradient(135deg, rgba(37,99,235,0.15), rgba(15,23,42,0.6)); border: 1px solid var(--primary); margin-bottom: 2.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
        <div>
          <span style="font-size: 3rem;">🔥</span>
          <h2 style="font-size: 2rem; margin-top: 0.3rem;" id="streak-banner-title">3 Day Study Streak!</h2>
          <p style="color: var(--text-secondary);">Keep logging in daily to maintain your learning streak.</p>
        </div>
      </div>

      <!-- Badges Grid -->
      <h3 style="font-size: 1.4rem; margin-bottom: 1.5rem;">Academic Badges</h3>
      <div class="wizard-grid" style="grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem;" id="badges-grid">
        <!-- Dynamically rendered -->
      </div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const unlocked = Store.getAchievements();
      const streak = Store.getStreakCount();
      document.getElementById('streak-banner-title').innerText = `${streak} Day Study Streak!`;

      const grid = document.getElementById('badges-grid');
      grid.innerHTML = ACHIEVEMENTS_DATA.map(badge => {
        const isUnlocked = unlocked.includes(badge.id);

        return `
          <div class="card" style="padding: 1.8rem; text-align: center; border: 1px solid ${isUnlocked ? 'var(--primary)' : 'var(--border-color)'}; opacity: ${isUnlocked ? '1' : '0.55'};">
            <div style="font-size: 3.5rem; margin-bottom: 0.8rem; filter: ${isUnlocked ? 'none' : 'grayscale(1)'};">${badge.icon}</div>
            <h4 style="font-size: 1.15rem; margin-bottom: 0.4rem;">${badge.title}</h4>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem;">${badge.desc}</p>
            <span class="badge ${isUnlocked ? 'badge-success' : 'badge-warning'}">
              ${isUnlocked ? 'UNLOCKED ✓' : 'LOCKED 🔒'}
            </span>
          </div>
        `;
      }).join('');
    });
  </script>
</body>
</html>
