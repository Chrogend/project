<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core Mathematics Lessons — MathVibe</title>
  <link rel="stylesheet" href="../css/style.css">
  <!-- KaTeX CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <script src="../js/data.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/app.js"></script>
</head>
<body class="dark-mode">

  <div id="app-header"></div>

  <div class="dashboard-wrapper">
    <div id="app-sidebar"></div>

    <main class="main-content" id="main-container">
      <!-- Content populated dynamically based on URL params -->
    </main>
  </div>

  <div id="app-footer"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const lessonId = urlParams.get('id');
      const pageNum = parseInt(urlParams.get('page')) || 1;

      if (lessonId && !isNaN(parseInt(lessonId))) {
        renderSingleLesson(parseInt(lessonId), pageNum);
      } else {
        renderCatalogue();
      }
    });

    // ----------------------------------------------------
    // MODE 1: CATALOGUE OF 20 MATHEMATICS TOPICS
    // ----------------------------------------------------
    function renderCatalogue() {
      const main = document.getElementById('main-container');
      const progress = Store.getProgress();

      main.innerHTML = `
        <div class="page-header" style="margin-bottom: 2rem;">
          <div>
            <h1 style="font-size: 2.2rem;">20 Core Mathematics Topics</h1>
            <p style="color: var(--text-secondary);">Select a topic to study 10-page lecture notes and attempt checkpoint quizzes.</p>
          </div>
        </div>

        <!-- Filter Controls -->
        <div style="display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; justify-content: space-between; align-items: center;">
          <div style="display: flex; gap: 0.6rem; flex-wrap: wrap;" id="catalogue-tabs">
            <button class="btn btn-primary" onclick="filterCatalogue('all', this)">All 20 Topics</button>
            <button class="btn btn-outline" onclick="filterCatalogue('1-5', this)">Topics 1–5</button>
            <button class="btn btn-outline" onclick="filterCatalogue('6-10', this)">Topics 6–10</button>
            <button class="btn btn-outline" onclick="filterCatalogue('11-15', this)">Topics 11–15</button>
            <button class="btn btn-outline" onclick="filterCatalogue('16-20', this)">Topics 16–20</button>
          </div>

          <input type="text" id="search-input" onkeyup="searchCatalogue()" placeholder="🔍 Search mathematics topics..." style="padding: 0.6rem 1rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary); min-width: 250px;">
        </div>

        <div class="wizard-grid" id="catalogue-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;">
          <!-- Dynamically inserted -->
        </div>
      `;

      filterCatalogue('all');
    }

    function filterCatalogue(group, btn = null) {
      if (btn) {
        document.querySelectorAll('#catalogue-tabs button').forEach(b => b.className = 'btn btn-outline');
        btn.className = 'btn btn-primary';
      }

      const grid = document.getElementById('catalogue-grid');
      const progress = Store.getProgress();
      const search = document.getElementById('search-input')?.value.toLowerCase() || '';

      const filtered = CURRICULUM_DATA.filter(t => {
        let matchesGroup = true;
        if (group === '1-5') matchesGroup = t.id >= 1 && t.id <= 5;
        else if (group === '6-10') matchesGroup = t.id >= 6 && t.id <= 10;
        else if (group === '11-15') matchesGroup = t.id >= 11 && t.id <= 15;
        else if (group === '16-20') matchesGroup = t.id >= 16 && t.id <= 20;

        const matchesSearch = t.title.toLowerCase().includes(search) || t.description.toLowerCase().includes(search) || t.code.toLowerCase().includes(search);
        return matchesGroup && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 3rem;">No mathematics topics matched your search.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(t => {
        const p = progress[t.id] || { status: 'not_started', bookmark: false };
        const statusBadge = p.status === 'completed' 
          ? `<span class="badge badge-success">✓ Completed</span>` 
          : p.status === 'started' 
          ? `<span class="badge badge-warning">In Progress</span>` 
          : `<span class="badge badge-info">Not Started</span>`;

        return `
          <div class="wizard-card" style="padding: 1.5rem; text-align: left; display: flex; flex-direction: column; justify-content: space-between; position: relative;">
            <div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem;">
                <span class="badge badge-info" style="font-weight: 700;">${t.code}</span>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                  ${p.bookmark ? '⭐' : ''}
                  ${statusBadge}
                </div>
              </div>

              <h3 style="font-size: 1.2rem; margin-bottom: 0.5rem;">${t.title}</h3>
              <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1.2rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
                ${t.description}
              </p>
            </div>

            <a href="lessons.html?id=${t.id}&page=1" class="btn btn-primary" style="width: 100%; text-align: center; font-size: 0.9rem;">
              Read 10-Page Lecture Sheet →
            </a>
          </div>
        `;
      }).join('');
    }

    function searchCatalogue() {
      const activeTab = document.querySelector('#catalogue-tabs .btn-primary');
      let group = 'all';
      if (activeTab) {
        const txt = activeTab.innerText.toLowerCase();
        if (txt.includes('1–5') || txt.includes('1-5')) group = '1-5';
        else if (txt.includes('6–10') || txt.includes('6-10')) group = '6-10';
        else if (txt.includes('11–15') || txt.includes('11-15')) group = '11-15';
        else if (txt.includes('16–20') || txt.includes('16-20')) group = '16-20';
      }
      filterCatalogue(group);
    }

    // ----------------------------------------------------
    // MODE 2: SINGLE LESSON READER WITH 10 PAGES & KATEX
    // ----------------------------------------------------
    function renderSingleLesson(id, pageNum) {
      const topic = CURRICULUM_DATA.find(t => t.id === id);
      if (!topic) {
        window.location.href = 'lessons.html';
        return;
      }

      const totalPages = topic.contentPages.length; // 10 pages
      const validPage = Math.max(1, Math.min(pageNum, totalPages));

      // Record reading progress
      Store.saveLessonProgress(id, { status: 'started', page: validPage });
      const p = Store.getLessonProgress(id);

      const main = document.getElementById('main-container');
      const currentPageContent = topic.contentPages[validPage - 1] || topic.contentPages[0];

      // Generate page selection tabs (1..10)
      let pageTabsHtml = '';
      for (let i = 1; i <= totalPages; i++) {
        const isActive = i === validPage;
        pageTabsHtml += `
          <a href="lessons.html?id=${topic.id}&page=${i}" 
             class="btn ${isActive ? 'btn-primary' : 'btn-outline'}" 
             style="padding: 0.4rem 0.8rem; font-size: 0.85rem; font-weight: 700; border-radius: 6px;">
            P${i}
          </a>
        `;
      }

      main.innerHTML = `
        <div style="margin-bottom: 1.5rem;">
          <a href="lessons.html" style="color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; text-decoration: none;">
            ← Back to 20 Topics Catalogue
          </a>
        </div>

        <div class="lesson-container card" style="padding: 2.5rem;">
          
          <!-- Header -->
          <div class="lesson-header" style="border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; margin-bottom: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
              <div>
                <span class="badge badge-info" style="margin-bottom: 0.5rem; font-weight: 700;">${topic.code}</span>
                <h1 style="font-size: 2.2rem; margin-top: 0.4rem;">${topic.title}</h1>
                <p style="color: var(--text-secondary); font-size: 1.05rem; margin-top: 0.4rem;">${topic.description}</p>
              </div>

              <div style="display: flex; gap: 0.8rem; align-items: center;">
                <button onclick="handleBookmark(${topic.id})" id="bookmark-btn" class="btn ${p.bookmark ? 'btn-primary' : 'btn-outline'}" style="font-size: 0.85rem; padding: 0.5rem 1rem;">
                  ${p.bookmark ? '⭐ Bookmarked' : '☆ Bookmark'}
                </button>

                ${p.status === 'completed' 
                  ? `<span class="badge badge-success" style="padding: 0.6rem 1rem; font-size: 0.85rem;">✓ Completed</span>` 
                  : `<button onclick="handleMarkCompleted(${topic.id})" class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.5rem 1rem;">✓ Mark Completed</button>`
                }
              </div>
            </div>

            <!-- Objectives List -->
            <div style="background: var(--bg-primary); padding: 1.2rem; border-radius: 12px; margin-top: 1.5rem; border: 1px solid var(--border-color);">
              <h4 style="color: var(--primary); font-size: 0.95rem; text-transform: uppercase; margin-bottom: 0.5rem;">Learning Objectives</h4>
              <ul style="padding-left: 1.2rem; color: var(--text-secondary); font-size: 0.9rem;">
                ${topic.objectives.map(obj => `<li>${obj}</li>`).join('')}
              </ul>
            </div>

            <!-- Direct 10 Page Navigation Bar -->
            <div style="margin-top: 1.5rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
              <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); margin-right: 0.5rem;">Jump to Page:</span>
              ${pageTabsHtml}
            </div>
          </div>

          <!-- Page Content Reader (KaTeX rendered math) -->
          <div id="math-reader-body" class="math-content" style="min-height: 350px; font-size: 1.05rem; line-height: 1.8;">
            ${App.renderMarkdown(currentPageContent)}
          </div>

          <!-- Page Navigation & Checkpoint Quiz Footer -->
          <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 1.5rem;">
            
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 1rem;">
              ${validPage > 1 
                ? `<a href="lessons.html?id=${topic.id}&page=${validPage - 1}" class="btn btn-outline">← Previous Page (P${validPage - 1})</a>`
                : `<div></div>`
              }

              <span style="font-weight: 700; color: var(--text-secondary);">Page ${validPage} of ${totalPages}</span>

              ${validPage < totalPages 
                ? `<a href="lessons.html?id=${topic.id}&page=${validPage + 1}" class="btn btn-primary">Next Page (P${validPage + 1}) →</a>`
                : `<button onclick="handleMarkCompleted(${topic.id})" class="btn btn-success">✓ Complete Module</button>`
              }
            </div>

            <!-- Checkpoint Quiz Banner -->
            <div style="background: var(--primary-glow); border: 1px solid var(--primary); padding: 1.2rem 1.8rem; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
              <div>
                <h4 style="font-size: 1.1rem; color: var(--primary);">Module Checkpoint Quiz</h4>
                <p style="font-size: 0.85rem; color: var(--text-secondary);">Test your comprehension of ${topic.title} with a timed checkpoint quiz.</p>
              </div>

              <a href="quizzes.html?id=${topic.id}" class="btn btn-primary" style="padding: 0.7rem 1.8rem;">
                Take Checkpoint Quiz →
              </a>
            </div>

          </div>

        </div>
      `;

      // Trigger KaTeX rendering on the lesson content
      App.renderMath('math-reader-body');
    }

    function handleBookmark(id) {
      const isBookmarked = Store.toggleBookmark(id);
      const btn = document.getElementById('bookmark-btn');
      if (btn) {
        btn.className = `btn ${isBookmarked ? 'btn-primary' : 'btn-outline'}`;
        btn.innerHTML = isBookmarked ? '⭐ Bookmarked' : '☆ Bookmark';
      }
      App.showToast(isBookmarked ? 'Topic bookmarked!' : 'Bookmark removed.', 'success');
    }

    function handleMarkCompleted(id) {
      Store.saveLessonProgress(id, { status: 'completed' });
      App.showToast('Module marked as completed! Badges updated.', 'success');
      setTimeout(() => {
        window.location.href = `lessons.html?id=${id}&page=10`;
      }, 500);
    }
  </script>
</body>
</html>
