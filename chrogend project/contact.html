<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact & Support — MathVibe</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</head>
<body class="dark-mode">

  <div id="app-header"></div>

  <main style="flex: 1; max-width: 800px; margin: 0 auto; width: 100%; padding: 3rem 1.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 class="executive-heading" style="font-size: 2.5rem;">Contact & Support</h1>
      <p style="color: var(--text-secondary);">Have a question or feedback regarding MathVibe 20 Mathematics Topics?</p>
    </div>

    <div class="card" style="padding: 2.5rem;">
      <form onsubmit="event.preventDefault(); App.showToast('Thank you! Your message has been sent to the instructor.', 'success');">
        <div style="margin-bottom: 1.2rem;">
          <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Full Name</label>
          <input type="text" class="input-control" placeholder="e.g. Suleiman Christian Audu" required style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
        </div>
        <div style="margin-bottom: 1.2rem;">
          <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Email Address</label>
          <input type="email" class="input-control" placeholder="e.g. student@mathvibe.org" required style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);">
        </div>
        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; font-weight: 600; margin-bottom: 0.4rem;">Message / Inquiry</label>
          <textarea rows="5" placeholder="Enter your question regarding mathematics topics, quizzes, or account access..." required style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary);"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem;">Send Message</button>
      </form>
    </div>
  </main>

  <div id="app-footer"></div>
</body>
</html>
